name: Release Blueprint Package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Blueprint Asset
        run: |
          mkdir -p dist
          COPYFILE_DISABLE=1 tar --exclude='.DS_Store' --exclude='*/.DS_Store' -czf dist/jarn.tar.gz .agents templates

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum jarn.tar.gz > checksums.txt

      - name: Extract Release Notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "No CHANGELOG section found for ${VERSION}" >&2
            exit 1
          fi

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/jarn.tar.gz
            dist/checksums.txt
